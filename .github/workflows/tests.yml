name: Application checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python scripts/test_deploy_vps.py
      - run: python scripts/concurrency_smoke.py
      - run: python scripts/invitation_concurrency_smoke.py
      - run: python scripts/invitation_migration_smoke.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py --screenshots artifacts/design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-design
          path: artifacts/design
          retention-days: 14

  publish:
    needs: [tests, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/restore-artistic-design'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mark this exact commit as verified for the VPS
        run: git push origin "HEAD:refs/tags/site-verified/${GITHUB_SHA}"
