{% extends 'base.html' %}
{% block title %}{{ title }} | درباره‌ی من{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="form-art-card art-panel {% if wide %}wide-card{% endif %}">
        <a class="back-link" href="{% url 'dashboard' %}">→ بازگشت به میز کار</a>

        <div class="card-badge-top">
            <span class="badge-dot"></span>
            <span>فرم مشخصات</span>
        </div>

        <h1 class="card-title">{{ title }}</h1>
        {% if hint %}
            <p class="card-subtitle">{{ hint }}</p>
        {% endif %}

        <form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %} class="standard-django-form">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions-row">
                <button class="btn btn-primary btn-lg" type="submit">ذخیره و ثبت نهایی</button>
                <a class="btn btn-outline" href="{% url 'dashboard' %}">انصراف</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
