{% extends 'base.html' %}
{% block title %}بازیابی رمز عبور | درباره‌ی من{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="form-art-card art-panel">
    <h1 class="card-title">بازیابی رمز عبور</h1>
    <p class="card-subtitle">اگر حسابی با این ایمیل وجود داشته باشد، راهنمای بازیابی ارسال می‌شود.</p>
    <form method="post" class="auth-form">
        {% csrf_token %} {{ form.as_p }}
        <button class="btn btn-primary btn-block btn-lg" type="submit">ارسال راهنما</button>
    </form>
</div></div>
{% endblock %}
