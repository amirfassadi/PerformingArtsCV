{% extends 'base.html' %}
{% block title %}تغییر رمز عبور | درباره‌ی من{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="form-art-card art-panel">
    {% if validlink %}
        <h1 class="card-title">رمز عبور جدید</h1>
        <form method="post" class="auth-form">
            {% csrf_token %} {{ form.as_p }}
            <button class="btn btn-primary btn-block btn-lg" type="submit">ذخیره رمز جدید</button>
        </form>
    {% else %}
        <h1 class="card-title">پیوند معتبر نیست</h1>
        <p class="notice notice-danger">این پیوند منقضی یا قبلاً مصرف شده است. درخواست تازه‌ای ثبت کنید.</p>
    {% endif %}
</div></div>
{% endblock %}
